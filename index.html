<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Greyson's Jeep Jump" />
<meta name="theme-color" content="#e9f7ff" />
<title>Greyson's Jeep Jump</title>
<style>
  :root {
    --green: #236b3a;
    --dark: #16351f;
    --cream: #fff7df;
    --gold: #ffd24d;
    --blue: #8bd7ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dff5ff; font-family: Georgia, serif; color: var(--dark); user-select: none; }
  #wrap { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; background: linear-gradient(#bdeeff, #f9f4d6); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding: 10px max(12px, env(safe-area-inset-left)) 8px max(12px, env(safe-area-inset-right)); background: rgba(255,247,223,.92); border-bottom: 2px solid rgba(22,53,31,.12); }
  h1 { margin:0; font-size: clamp(20px, 4vw, 32px); letter-spacing:.02em; font-weight: normal; }
  .hud { display:flex; align-items:center; gap:10px; font-size: clamp(13px, 2.7vw, 17px); white-space: nowrap; }
  .pill { background: white; border: 2px solid rgba(22,53,31,.14); border-radius: 999px; padding: 5px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  #game { width:100%; height:100%; display:block; touch-action: none; }
  #controls { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 10px max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-right)); background: rgba(255,247,223,.95); border-top: 2px solid rgba(22,53,31,.12); }
  button { font-family: Georgia, serif; font-size: clamp(18px, 5vw, 34px); font-weight: bold; min-height: 72px; border-radius: 22px; border: 3px solid rgba(22,53,31,.2); background: white; color: var(--dark); box-shadow: 0 7px 0 rgba(22,53,31,.18), 0 4px 20px rgba(0,0,0,.12); touch-action: none; }
  button:active, button.down { transform: translateY(5px); box-shadow: 0 2px 0 rgba(22,53,31,.18), 0 2px 12px rgba(0,0,0,.10); }
  #brake { background:#ffe8e8; }
  #jump { background:#fff2a8; }
  #gas { background:#dcffd9; }
  #overlay { position: fixed; inset: 0; display:flex; align-items:center; justify-content:center; pointer-events: none; }
  .card { max-width: min(640px, 92vw); background: rgba(255,255,255,.93); border: 3px solid rgba(22,53,31,.2); border-radius: 28px; padding: 24px; text-align:center; box-shadow: 0 24px 80px rgba(0,0,0,.2); pointer-events: auto; }
  .card h2 { margin:0 0 8px; font-size: clamp(28px, 8vw, 56px); font-weight: normal; }
  .card p { margin: 8px 0 18px; font-size: clamp(16px, 4vw, 24px); line-height:1.35; }
  .small { font-size: clamp(13px, 3vw, 17px); color:#4c6654; }
  .play { min-height:64px; padding: 10px 28px; font-size: clamp(20px, 5vw, 30px); background: #e7ffd7; }
  @media (max-height: 520px) {
    header { padding-top:6px; padding-bottom:5px; }
    #controls { padding-top:7px; }
    button { min-height: 58px; border-radius:18px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>Greyson's Jeep Jump</h1>
    <div class="hud">
      <span class="pill" id="worldName">Farm</span>
      <span class="pill"><span id="stars">0</span> ⭐</span>
      <span class="pill" id="distance">0%</span>
    </div>
  </header>
  <canvas id="game"></canvas>
  <div id="controls" aria-label="game controls">
    <button id="brake">BRAKE</button>
    <button id="jump">JUMP</button>
    <button id="gas">GAS</button>
  </div>
</div>
<div id="overlay"></div>
<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const gasBtn = document.getElementById('gas');
  const brakeBtn = document.getElementById('brake');
  const jumpBtn = document.getElementById('jump');
  const worldName = document.getElementById('worldName');
  const distance = document.getElementById('distance');
  const starsEl = document.getElementById('stars');
  const overlay = document.getElementById('overlay');

  let W=0,H=0,dpr=1;
  function resize(){
    dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    const rect = canvas.getBoundingClientRect();
    W = Math.floor(rect.width); H = Math.floor(rect.height);
    canvas.width = Math.floor(W*dpr); canvas.height = Math.floor(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const courseLength = 9000;
  const worlds = [
    {name:'Farm', start:0, end:1800, sky:'#bdeeff', ground:'#7fc85f', hill:'#5da94b'},
    {name:'Jungle', start:1800, end:3600, sky:'#b8f0d1', ground:'#40a35f', hill:'#21804a'},
    {name:'Desert', start:3600, end:5400, sky:'#ffe4a6', ground:'#dfa74b', hill:'#c3842f'},
    {name:'Mountains', start:5400, end:7200, sky:'#d6e8ff', ground:'#829d74', hill:'#536b56'},
    {name:'Space', start:7200, end:9000, sky:'#10152f', ground:'#7c7aa8', hill:'#5f5d89'}
  ];
  const waters = [
    {x:1180,w:135}, {x:2520,w:165}, {x:4100,w:175}, {x:6150,w:190}, {x:7900,w:230}
  ];
  const stars = [];
  for (let i=350;i<courseLength-400;i+=420) stars.push({x:i, y:-90 - (i%3)*35, got:false});

  let keys = {gas:false, brake:false, jump:false};
  let jeep = {x:60, y:0, vx:0, vy:0, angle:0, grounded:false, stars:0, checkpoint:60};
  let cameraX = 0;
  let state = 'intro';
  let last=performance.now();
  let messageTimer = 0;

  function getWorld(x){ return worlds.find(w=>x>=w.start && x<w.end) || worlds[worlds.length-1]; }
  function waterAt(x){ return waters.find(w=>x>w.x && x<w.x+w.w); }
  function terrainY(x){
    if (waterAt(x)) return null;
    const w = getWorld(x);
    let base = H*0.72;
    if (w.name==='Farm') base += Math.sin(x/150)*22 + Math.sin(x/55)*8;
    if (w.name==='Jungle') base += Math.sin(x/115)*32 + Math.sin(x/37)*12;
    if (w.name==='Desert') base += Math.sin(x/180)*24 + Math.sin(x/70)*10;
    if (w.name==='Mountains') base += Math.sin(x/145)*48 + Math.sin(x/55)*24;
    if (w.name==='Space') base += Math.sin(x/130)*28 + Math.sin(x/45)*14;
    // Friendly ramps before water.
    for (const p of waters) {
      const dx = p.x - x;
      if (dx>0 && dx<170) base -= (170-dx)*0.38;
      const rx = x - (p.x+p.w);
      if (rx>0 && rx<120) base -= (120-rx)*0.20;
    }
    return Math.min(H-55, Math.max(H*0.48, base));
  }
  function slopeAt(x){ const a=terrainY(x-4), b=terrainY(x+4); if(a==null||b==null)return 0; return Math.atan2(b-a,8); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

  function bindButton(btn, name){
    const down = e=>{ e.preventDefault(); keys[name]=true; btn.classList.add('down'); if(name==='jump') doJump(); if(state==='intro') startGame(); };
    const up = e=>{ e.preventDefault(); keys[name]=false; btn.classList.remove('down'); };
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('pointerleave', up);
  }
  bindButton(gasBtn,'gas'); bindButton(brakeBtn,'brake'); bindButton(jumpBtn,'jump');
  window.addEventListener('keydown', e=>{
    if(e.code==='ArrowRight'||e.code==='KeyD') keys.gas=true;
    if(e.code==='ArrowLeft'||e.code==='KeyA') keys.brake=true;
    if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') { if(!keys.jump) doJump(); keys.jump=true; }
    if(state==='intro') startGame();
  });
  window.addEventListener('keyup', e=>{
    if(e.code==='ArrowRight'||e.code==='KeyD') keys.gas=false;
    if(e.code==='ArrowLeft'||e.code==='KeyA') keys.brake=false;
    if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') keys.jump=false;
  });

  function doJump(){
    if(jeep.grounded && state==='play') {
      jeep.vy = -620 - Math.min(jeep.vx, 620)*0.08;
      jeep.grounded = false;
      jeep.angle -= 0.08;
      beep(660,0.08,'square',0.04);
    }
  }
  function beep(freq,dur,type,vol){
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
      const ac=beep.ac||(beep.ac=new AC()); if(ac.state==='suspended')ac.resume();
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type||'sine'; o.frequency.value=freq; g.gain.value=vol||0.03; o.connect(g); g.connect(ac.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur); o.stop(ac.currentTime+dur);
    }catch(e){}
  }
  function startGame(){ state='play'; overlay.innerHTML=''; }
  function resetToCheckpoint(){
    jeep.x = Math.max(60, jeep.checkpoint); jeep.vx=80; jeep.vy=0; jeep.angle=0; jeep.grounded=false;
    message('Oops! Try again 🚙');
  }
  function message(text){
    const card = document.createElement('div'); card.className='card'; card.innerHTML='<h2>'+text+'</h2><p class="small">No problem. Keep driving.</p>';
    overlay.innerHTML=''; overlay.appendChild(card); messageTimer=1.2;
  }
  function showIntro(){
    overlay.innerHTML = '<div class="card"><h2>Greyson\'s Jeep Jump</h2><p>Drive the green Jeep through the farm, jungle, desert, mountains, and outer space.</p><p class="small">Use GAS, BRAKE, and JUMP. It is friendly first. We can make it harder later.</p><button class="play" id="playBtn">Start Jeep</button></div>';
    document.getElementById('playBtn').onclick = startGame;
  }
  function showWin(){
    state='win';
    overlay.innerHTML = '<div class="card"><h2>Finish Line!</h2><p>Greyson drove the Jeep across the whole world.</p><p>Stars: '+jeep.stars+' ⭐</p><button class="play" id="againBtn">Drive Again</button></div>';
    document.getElementById('againBtn').onclick = ()=>{ location.reload(); };
    beep(523,.09,'sine',.05); setTimeout(()=>beep(659,.09,'sine',.05),100); setTimeout(()=>beep(784,.15,'sine',.05),220);
  }
  showIntro();

  function update(dt){
    if(state!=='play') return;
    if(messageTimer>0){ messageTimer-=dt; if(messageTimer<=0) overlay.innerHTML=''; }
    const accel = keys.gas ? 520 : 0;
    const brake = keys.brake ? 720 : 0;
    jeep.vx += accel*dt;
    jeep.vx -= brake*dt;
    jeep.vx -= 80*dt; // rolling drag
    jeep.vx = clamp(jeep.vx, 0, 760);
    if(keys.gas && jeep.grounded) jeep.angle += 0.02*dt;
    jeep.x += jeep.vx*dt;
    jeep.vy += 1180*dt;
    jeep.y += jeep.vy*dt;

    const gy = terrainY(jeep.x);
    if(gy!==null && jeep.y > gy-28 && jeep.vy>=-40) {
      jeep.y = gy-28; jeep.vy=0; jeep.grounded=true; jeep.angle += (slopeAt(jeep.x)-jeep.angle)*0.14;
      if(jeep.vx>80) jeep.checkpoint = Math.max(jeep.checkpoint, jeep.x-260);
    } else {
      jeep.grounded=false; jeep.angle += (jeep.vx>300?0.55:0.25)*dt;
    }
    if(jeep.y > H+220) resetToCheckpoint();
    if(jeep.angle > 1.25 || jeep.angle < -1.25) resetToCheckpoint();

    for(const s of stars){
      if(!s.got){
        const sy = (terrainY(s.x)||H*.72)+s.y;
        const dx = s.x-jeep.x, dy = sy-jeep.y;
        if(dx*dx+dy*dy < 70*70){ s.got=true; jeep.stars++; beep(880,.06,'sine',.03); }
      }
    }
    if(jeep.x >= courseLength-110) showWin();
    cameraX += ((jeep.x - W*0.32) - cameraX)*0.08;
    cameraX = clamp(cameraX,0,courseLength-W*.6);
    const ww = getWorld(jeep.x); worldName.textContent = ww.name; distance.textContent = Math.floor((jeep.x/(courseLength-110))*100)+'%'; starsEl.textContent = jeep.stars;
  }

  function draw(){
    const ww = getWorld(jeep.x);
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, ww.sky); grad.addColorStop(.65, '#f8f3d1'); grad.addColorStop(1, '#fff7df');
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
    drawBackground(ww);
    drawTerrain();
    drawStars();
    drawFinish();
    drawJeep();
  }
  function sx(x){ return x-cameraX; }
  function drawBackground(w){
    ctx.save();
    if(w.name==='Space'){
      ctx.fillStyle='#fff'; for(let i=0;i<70;i++){ const x=(i*173)%courseLength, y=30+(i*47)%Math.max(80,H*.45); const xx=sx(x*.55); if(xx>-20&&xx<W+20) ctx.fillRect(xx,y,2,2); }
      ctx.fillStyle='rgba(255,230,110,.9)'; ctx.beginPath(); ctx.arc(W-95,70,28,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle='rgba(255,255,255,.65)'; for(let i=0;i<7;i++){ cloud(sx((i*650+200)*.5), 55+(i%3)*45, 1+(i%2)*.25); }
      ctx.fillStyle='rgba(255,216,80,.9)'; ctx.beginPath(); ctx.arc(W-90,70,34,0,Math.PI*2); ctx.fill();
    }
    for(let x=Math.floor(cameraX/260)*260-260; x<cameraX+W+260; x+=260){
      const xx=sx(x); const y=H*.55 + Math.sin(x/300)*25;
      if(w.name==='Farm'){ ctx.fillStyle='rgba(70,120,40,.35)'; ctx.fillRect(xx+60,y,16,70); circle(xx+68,y,42,'rgba(78,160,63,.55)'); }
      if(w.name==='Jungle'){ ctx.fillStyle='rgba(20,100,60,.65)'; ctx.fillRect(xx+90,y-5,18,95); circle(xx+99,y-10,52,'rgba(20,130,70,.55)'); circle(xx+62,y,38,'rgba(50,160,80,.45)'); }
      if(w.name==='Desert'){ ctx.fillStyle='rgba(170,115,50,.45)'; cactus(xx+100,y+20); }
      if(w.name==='Mountains'){ ctx.fillStyle='rgba(76,91,88,.25)'; mountain(xx-40,H*.62,150); mountain(xx+60,H*.60,190); }
    }
    ctx.restore();
  }
  function cloud(x,y,s){ if(x<-120||x>W+120)return; ctx.beginPath(); ctx.arc(x,y,25*s,0,Math.PI*2); ctx.arc(x+28*s,y+5*s,22*s,0,Math.PI*2); ctx.arc(x-28*s,y+8*s,18*s,0,Math.PI*2); ctx.fill(); }
  function circle(x,y,r,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
  function cactus(x,y){ ctx.lineWidth=10; ctx.strokeStyle='rgba(50,130,70,.5)'; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-65); ctx.moveTo(x,y-35); ctx.lineTo(x-25,y-50); ctx.moveTo(x,y-25); ctx.lineTo(x+25,y-42); ctx.stroke(); }
  function mountain(x,y,w){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w*.5,y-w*.55); ctx.lineTo(x+w,y); ctx.closePath(); ctx.fill(); }
  function drawTerrain(){
    ctx.save();
    // water
    for(const p of waters){ const xx=sx(p.x); if(xx+p.w<0||xx>W)continue; ctx.fillStyle='#44b7ff'; ctx.fillRect(xx,H*.72,p.w,H*.28); ctx.fillStyle='rgba(255,255,255,.5)'; for(let i=0;i<4;i++){ ctx.fillRect(xx+20+i*42,H*.75+Math.sin(i)*10,25,3); }}
    ctx.beginPath(); let started=false;
    for(let px=-20; px<W+30; px+=8){ const wx=px+cameraX; const y=terrainY(wx); if(y==null){ if(started){ ctx.lineTo(px-8,H+80); ctx.closePath(); ctx.fillStyle=getWorld(wx-50).ground; ctx.fill(); started=false;} continue; }
      if(!started){ ctx.beginPath(); ctx.moveTo(px,H+80); ctx.lineTo(px,y); started=true; } else ctx.lineTo(px,y);
    }
    if(started){ ctx.lineTo(W+30,H+80); ctx.closePath(); ctx.fillStyle=getWorld(jeep.x).ground; ctx.fill(); }
    // top line
    ctx.beginPath(); started=false;
    for(let px=-20; px<W+30; px+=8){ const wx=px+cameraX; const y=terrainY(wx); if(y==null){ started=false; continue; } if(!started){ ctx.moveTo(px,y); started=true; } else ctx.lineTo(px,y); }
    ctx.lineWidth=5; ctx.strokeStyle=getWorld(jeep.x).hill; ctx.stroke();
    ctx.restore();
  }
  function drawStars(){
    ctx.save();
    for(const s of stars){ if(s.got) continue; const xx=sx(s.x); if(xx<-40||xx>W+40) continue; const y=(terrainY(s.x)||H*.72)+s.y; star(xx,y,14,'#ffd54d'); }
    ctx.restore();
  }
  function star(x,y,r,c){ ctx.fillStyle=c; ctx.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5; const rr=i%2? r*.45:r; ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); } ctx.closePath(); ctx.fill(); ctx.strokeStyle='rgba(120,80,0,.25)'; ctx.stroke(); }
  function drawFinish(){
    const x=sx(courseLength-80); if(x<-100||x>W+100)return;
    ctx.strokeStyle='#222'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(x,H*.25); ctx.lineTo(x,H*.75); ctx.stroke();
    for(let i=0;i<6;i++){ for(let j=0;j<4;j++){ ctx.fillStyle=(i+j)%2?'#111':'#fff'; ctx.fillRect(x+5+i*18,H*.25+j*14,18,14); }}
  }
  function drawJeep(){
    const x=sx(jeep.x), y=jeep.y;
    ctx.save(); ctx.translate(x,y); ctx.rotate(jeep.angle);
    // shadow
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0,36,48,9,0,0,Math.PI*2); ctx.fill();
    // wheels
    wheel(-32,24); wheel(32,24);
    // body
    ctx.fillStyle='#246f38'; roundRect(-55,-24,110,42,10); ctx.fill();
    ctx.fillStyle='#2f8b47'; roundRect(-32,-54,55,34,8); ctx.fill();
    ctx.fillStyle='#b8efff'; roundRect(-24,-48,18,20,4); ctx.fill(); roundRect(0,-48,17,20,4); ctx.fill();
    ctx.fillStyle='#16351f'; ctx.fillRect(-58,4,116,7);
    ctx.fillStyle='#ffd24d'; ctx.beginPath(); ctx.arc(55,-7,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff7777'; ctx.fillRect(-61,-8,6,12);
    ctx.fillStyle='#0e2a18'; ctx.font='bold 16px Georgia'; ctx.textAlign='center'; ctx.fillText('G',0,0);
    ctx.restore();
  }
  function wheel(x,y){ ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(x,y,16,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#ddd'; ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2); ctx.fill(); }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function loop(now){ const dt=Math.min(.033,(now-last)/1000); last=now; update(dt); draw(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
